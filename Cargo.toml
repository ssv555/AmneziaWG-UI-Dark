[package]
name = "awg-ui"
version = "0.3.0"
edition = "2021"
description = "Окно управления туннелями AmneziaWG поверх штатного amneziawg.exe"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts"] }
# Версия — та же, что у egui-wgpu; без этого в сборку на Windows попадает только GL.
wgpu = { version = "24", default-features = false, features = ["dx12"] }
raw-window-handle = "0.6"
x25519-dalek = { version = "2", features = ["static_secrets"] }
png = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# UI Automation (COM) — управление родным окном AmneziaWG; та же версия, что уже тянет wgpu.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[build-dependencies]
winresource = "0.1"
