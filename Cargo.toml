[package]
name = "awg-ui"
version = "0.5.1"
edition = "2021"
description = "Окно управления туннелями AmneziaWG поверх штатного amneziawg.exe"

[dependencies]
# "links": с eframe 0.36 ссылки (окно «О программе», заметки к выпуску) открываются в браузере только с этой фичей.
# "accesskit": дерево доступности egui уходит в UI Automation Windows — без неё Narrator и NVDA видят пустое окно.
eframe = { version = "0.36", default-features = false, features = ["wgpu_no_default_features", "default_fonts", "links", "accesskit"] }
# Версия — та же, что у egui-wgpu. Бэкенд wgpu выбираем сами — только DX12: фича eframe "wgpu" с 0.34 включает
# все бэкенды wgpu по умолчанию (Vulkan, GL, Metal), поэтому у eframe фича без них, а DX12 включает эта строка.
wgpu = { version = "30", default-features = false, features = ["dx12"] }
raw-window-handle = "0.6"
x25519-dalek = { version = "2", features = ["static_secrets"] }
png = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Импорт туннелей из zip и резервная копия с паролем (AES-256).
zip = { version = "8.6", default-features = false, features = ["aes-crypto", "deflate"] }
# Проверка файлов движка перед копированием для службы SYSTEM.
sha2 = "0.11"
# Обмен окна с ядром (служба) по именованному каналу.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Подпись манифеста наших релизов (обновление программы и движка): проверка Ed25519.
ed25519-dalek = "3"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# UI Automation (COM), панель задач, ярлыки. wgpu-hal 30 — на той же windows 0.62.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[build-dependencies]
winresource = "0.1"
sha2 = "0.11"
