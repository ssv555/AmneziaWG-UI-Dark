# Tag vX.Y.Z -> tests, release build, GitHub Release with awg-ui.exe and notes from CHANGELOG.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          # Job has contents: write; keep the token out of .git/config so build scripts cannot read it.
          persist-credentials: false

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Tag matches Cargo.toml
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($cargo -ne $version) { throw "tag $env:GITHUB_REF_NAME does not match Cargo.toml version $cargo" }
          "VERSION=$version" >> $env:GITHUB_ENV

      # Fail in the first seconds, not after the engine build and the tests: without the key the manifest cannot be signed.
      - name: Signing key is set
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_SIGNING_KEY)) { throw 'secret UPDATE_SIGNING_KEY is empty: add the update signing key (see CONTRIBUTING.md)' }

      # Built-in engine (working mode 2) before the app: build.rs embeds the SHA-256 of its DLLs into awg-ui.exe.
      - name: Engine
        run: ./engine/build.ps1

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          New-Item -ItemType Directory dist, pack | Out-Null
          Copy-Item target\release\awg-ui.exe dist\awg-ui.exe
          Copy-Item target\release\awg-ui.exe, LICENSE, README.md, README.ru.md, CHANGELOG.md, CHANGELOG.ru.md pack\
          Copy-Item engine\out\* pack\
          Compress-Archive -Path pack\* -DestinationPath "dist\AmneziaWG-UI-Dark-v$env:VERSION-x64.zip"

      # Signed manifest for in-app updates: versions, sizes and SHA-256 of awg-ui.exe and the engine DLLs.
      # The DLLs are published as separate assets so the app downloads only what it needs.
      - name: Update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          $build = Get-Content engine\build.ps1 -Raw
          if ($build -notmatch '(?m)^\s*\$EngineTag\s*=\s*[''"]v?([0-9][^''"]*)[''"]') { throw 'engine/build.ps1: $EngineTag not found' }
          $engineVersion = $Matches[1]
          if ($build -notmatch 'wintun-([0-9]+\.[0-9]+\.[0-9]+)\.zip') { throw 'engine/build.ps1: wintun version not found' }
          $wintunVersion = $Matches[1]
          function Entry($path) {
            $file = Get-Item $path
            [ordered]@{ name = $file.Name; sha256 = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower(); size = $file.Length }
          }
          $manifest = [ordered]@{
            version = $env:VERSION
            published = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd'T'HH:mm:ss'Z'", [Globalization.CultureInfo]::InvariantCulture)
            app = Entry target\release\awg-ui.exe
            engine = [ordered]@{
              version = $engineVersion
              wintun = $wintunVersion
              files = @((Entry engine\out\tunnel.dll), (Entry engine\out\wintun.dll))
            }
          }
          [IO.File]::WriteAllText("$PWD\dist\update-manifest.json", ($manifest | ConvertTo-Json -Depth 5 -Compress), [Text.UTF8Encoding]::new($false))
          Copy-Item engine\out\tunnel.dll, engine\out\wintun.dll dist\

          $sshKeygen = (Get-Command ssh-keygen -ErrorAction SilentlyContinue).Source
          if (-not $sshKeygen) { $sshKeygen = 'C:\Program Files\Git\usr\bin\ssh-keygen.exe' }
          $key = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetRandomFileName())
          try {
            # Empty file, access for the current user only, then the key: it is never readable by others.
            New-Item -ItemType File $key | Out-Null
            icacls $key /inheritance:r /grant:r "$([Security.Principal.WindowsIdentity]::GetCurrent().Name):F" | Out-Null
            if ($LASTEXITCODE) { throw 'icacls failed on the temporary key file' }
            [IO.File]::WriteAllText($key, ($env:UPDATE_SIGNING_KEY -replace "`r", '').TrimEnd() + "`n", [Text.UTF8Encoding]::new($false))
            & $sshKeygen -Y sign -f $key -n awg-ui-update dist\update-manifest.json
            if ($LASTEXITCODE) { throw "ssh-keygen -Y sign failed ($LASTEXITCODE)" }
          } finally {
            Remove-Item $key -Force -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path dist\update-manifest.json.sig)) { throw 'update-manifest.json.sig was not created' }
          Get-Content dist\update-manifest.json

      - name: Checksums
        run: |
          # Hashes first, file second: Out-File would create SHA256SUMS.txt in dist before the listing.
          $sums = Get-ChildItem dist | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $sums | Out-File dist\SHA256SUMS.txt -Encoding utf8NoBOM
          $sums

      - name: Release notes from CHANGELOG
        run: |
          function Changes($file) {
            $pattern = '^\| \[?' + [regex]::Escape($env:VERSION) + '[\]\s|]'
            $row = Get-Content $file -Encoding utf8 | Where-Object { $_ -match $pattern } | Select-Object -First 1
            if (-not $row) { throw "$file has no row for $env:VERSION" }
            ($row -split ' \| ')[2].TrimEnd(' ', '|') -split '<br>' | ForEach-Object { "- $_" }
          }
          $notes = @(
            "## What's new"
            Changes CHANGELOG.md
            ''
            '## Что нового'
            Changes CHANGELOG.ru.md
            ''
            '---'
            '`awg-ui.exe` is a single portable file for Windows 10/11 x64; it works on top of the official AmneziaWG client.'
            'The zip also contains the built-in engine (`tunnel.dll`, `wintun.dll`) for the mode that works without an installed AmneziaWG.'
            'The file is not code-signed yet, so Windows SmartScreen may warn on first start: "More info" -> "Run anyway".'
            'Checksums are in `SHA256SUMS.txt`.'
          )
          $notes | Out-File notes.md -Encoding utf8NoBOM

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist).FullName `
            --title "AmneziaWG UI Dark v$env:VERSION" --notes-file notes.md
